name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Install qmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-declarative-dev-tools
      - name: Panel checks
        run: bash scripts/check-panel.sh
      - name: Install Secret Service dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gnome-keyring dbus-x11
          mkdir -p ~/.local/share/keyrings
          chmod 700 -R ~/.local
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Test
        run: |
          echo 'ci-password' | gnome-keyring-daemon --unlock
          make test
        shell: dbus-run-session -- bash --noprofile --norc -eo pipefail {0}
      - name: Coverage report
        run: |
          echo 'ci-password' | gnome-keyring-daemon --unlock
          cd engine && go test -count=1 -coverprofile=coverage.out ./... >/dev/null \
            && go tool cover -func=coverage.out | tail -1 && rm -f coverage.out
        shell: dbus-run-session -- bash --noprofile --norc -eo pipefail {0}

  build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - goarch: amd64
            release_name: x86_64
          - goarch: arm64
            release_name: aarch64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: engine/go.mod
          cache-dependency-path: engine/go.sum
      - name: Build linux/${{ matrix.goarch }} (${{ matrix.release_name }})
        run: |
          mkdir -p dist/omaseal-linux-${{ matrix.release_name }}
          cd engine
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build \
            -ldflags "-X main.version=dev -X main.commit=${GITHUB_SHA::7}" \
            -o omaseal .
          cd ..
          cp engine/omaseal dist/omaseal-linux-${{ matrix.release_name }}/omaseal
          cp BarWidget.qml Panel.qml PanelJobs.qml PanelModel.qml SecretsView.qml AgentSection.qml AddEditForm.qml manifest.json README.md LICENSE dist/omaseal-linux-${{ matrix.release_name }}/
          tar -czf dist/omaseal-linux-${{ matrix.release_name }}.tar.gz -C dist omaseal-linux-${{ matrix.release_name }}
