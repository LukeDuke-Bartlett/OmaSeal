name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # actions/upload-artifact v4+ authenticates via ACTIONS_RUNTIME_TOKEN,
      # so no GITHUB_TOKEN write scope is required here.
    strategy:
      matrix:
        include:
          - goarch: amd64
            release_name: x86_64
          - goarch: arm64
            release_name: aarch64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: engine/go.mod
      - name: Build linux/${{ matrix.goarch }} (${{ matrix.release_name }})
        run: |
          mkdir -p dist/omaseal-linux-${{ matrix.release_name }}
          cd engine
          CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build \
            -ldflags "-X main.version=${GITHUB_REF_NAME} -X main.commit=${GITHUB_SHA::7}" \
            -o omaseal .
          cd ..
          # Stamp the plugin manifest version from the tag — same source as
          # main.version above — so the tarball never reports a stale version.
          # Double quotes: the parameter expansion must run inside the sed
          # program, and the grep proves the stamp actually landed (sed exits
          # 0 on zero substitutions).
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${GITHUB_REF_NAME#v}\"/" manifest.json
          grep -q "\"version\": \"${GITHUB_REF_NAME#v}\"" manifest.json \
            || { echo "manifest.json version stamp did not land" >&2; exit 1; }
          cp engine/omaseal dist/omaseal-linux-${{ matrix.release_name }}/omaseal
          cp BarWidget.qml Panel.qml PanelJobs.qml PanelModel.qml SecretsView.qml AgentSection.qml AddEditForm.qml manifest.json README.md LICENSE contrib/omaseal-provider.service dist/omaseal-linux-${{ matrix.release_name }}/
          tar -czf dist/omaseal-linux-${{ matrix.release_name }}.tar.gz -C dist omaseal-linux-${{ matrix.release_name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omaseal-linux-${{ matrix.release_name }}
          path: dist/omaseal-linux-${{ matrix.release_name }}.tar.gz

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Write checksums
        run: |
          cd dist
          sha256sum *.tar.gz > sha256sums.txt
      - name: Sign checksums
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$GPG_KEY_ID" ] || [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "GPG signing skipped: add GPG_KEY_ID and GPG_PRIVATE_KEY secrets for signed releases." >&2
            exit 0
          fi
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          cd dist
          gpg --batch --yes --armor --detach-sign --default-key "$GPG_KEY_ID" -o sha256sums.txt.asc sha256sums.txt
      - name: Create GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            dist/*.tar.gz
            dist/sha256sums*
          generate_release_notes: true

  # Post-release packaging bump. Container jobs run as root and makepkg
  # refuses root — so the work runs as a non-root builder via runuser on
  # the chowned workspace. gh is not in the archlinux image, hence
  # github-cli in the pacman line; and because the checkout uses
  # persist-credentials: false, `gh auth setup-git` supplies the push
  # credentials. HOME must be repointed — runuser without -l inherits the
  # root-context HOME (/github/home), which builder cannot write. Note:
  # a GITHUB_TOKEN-authored PR does not trigger ci.yml's pull_request
  # checks — it merges on maintainer review.
  bump-packaging:
    needs: release
    runs-on: ubuntu-latest
    # Digest-pinned: this job holds contents:write + pull-requests:write, so
    # the image that executes it must not be a mutable tag. Review and bump
    # the digest deliberately (archlinux:latest rebuilds roughly monthly).
    container: archlinux@sha256:204e91950fd364961088a01773eee9012243b7e965fed42b1d82d12416190782 # latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # archlinux ships no git, and without git in PATH checkout falls back
      # to a REST-API tarball with no .git — every git/gh step below would
      # die. Install BEFORE checkout, and use -Syu (not -Sy): a partial
      # upgrade can leave a git built against unsynced libraries.
      # makepkg ships in pacman (already installed); no toolchain needed —
      # bump.sh only runs makepkg --printsrcinfo, never a build.
      - name: Full system upgrade + install git and gh
        run: pacman -Syu --noconfirm --needed git github-cli
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Bump packaging and open PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OMASEAL_SIGNING_FINGERPRINT: ${{ secrets.OMASEAL_SIGNING_FINGERPRINT }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          runuser -u builder -- env HOME=/home/builder bash -euo pipefail -c '
            cd "$GITHUB_WORKSPACE"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            gh auth setup-git
            git checkout -b "bump/${TAG}"
            if [ -n "${OMASEAL_SIGNING_FINGERPRINT:-}" ]; then
              packaging/aur/bump.sh "${TAG}"
            else
              packaging/aur/bump.sh "${TAG}" --allow-unsigned
            fi
            # Fresh checkout: anything dirty is bump.sh output. Stage all of
            # it so the scope check can see out-of-scope writes too.
            files="install.sh packaging/aur/.SRCINFO packaging/aur/PKGBUILD packaging/aur/PKGBUILD-bin packaging/aur/omaseal-bin.SRCINFO"
            git add -A
            changed=$(git diff --cached --name-only | sort)
            expected=$(printf "%s\n" $files | sort)
            [ "$changed" = "$expected" ] || {
              echo "unexpected diff scope:" >&2
              git diff --cached --name-only >&2
              exit 1
            }
            git commit -m "chore(packaging): bump pins to ${TAG}"
            git push -u origin "bump/${TAG}"
            gh pr create --base main \
              --title "chore(packaging): bump AUR/installer pins to ${TAG}" \
              --body "Automated post-release pin bump for ${TAG}. Verify the pinned hashes against the release assets before merging."
          '
